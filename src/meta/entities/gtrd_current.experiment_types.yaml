gtrd_current.experiment_types:
  type: table
  displayName: Experiment types
  order: '10'
  primaryKey: id
  scheme:
    columns:
    - id:
        type: VARCHAR(20)
    - description:
        type: TEXT

  queries:
  - '*** Selection view ***':
      type: 1D_unknown
      code: SELECT ID AS "Code", ID AS "Name" FROM ${INFO_SCHEMA}.experiment_types ORDER BY order_

  - 'Types for files':
      type: 1D_unknown
      code: |-
          SELECT
            e2d.experiment_type AS "Code",
            e2d.experiment_type AS "Name",
            IFNULL(e.order_, 10) AS "Order"
          FROM ${INFO_SCHEMA}.experiment2data_types e2d 
          LEFT JOIN ${INFO_SCHEMA}.experiment_types e ON e.id = e2d.experiment_type
          WHERE (1=1)
          <if parameter="species">
            AND e2d.species = '<parameter:species/>'
          </if>
          GROUP BY 1
          ORDER BY 3      