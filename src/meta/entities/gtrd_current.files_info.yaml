gtrd_current.files_info:
  type: table
  displayName: Downloads
  order: '50'
  primaryKey: id
  scheme:
    columns:
    - id:
        type: BIGINT
        primaryKey: true
    - exp_id:
        type: VARCHAR(100)
        canBeNull: true
    - peaks_id:
        type: VARCHAR(100)
        canBeNull: true
    - exp_design:
        type: VARCHAR(100)
        canBeNull: true
    - data_type:
        type: VARCHAR(100)
        canBeNull: true
    - target:
        type: VARCHAR(100)
        canBeNull: true
    - cell_id:
        type: VARCHAR(100)
        canBeNull: true
    - peakcaller:
        type: VARCHAR(100)
        canBeNull: true
    - species:
        type: VARCHAR(100)
        canBeNull: true
    - assembly:
        type: VARCHAR(100)
        canBeNull: true
    - name:
        type: VARCHAR(255)
        canBeNull: true
    - path:
        type: VARCHAR(1000)
    - format:
        type: VARCHAR(100)
        canBeNull: true
    - item_count:
        type: BIGINT
        canBeNull: true
    - size:
        type: BIGINT

  queries:

  - List:
      type: 1D_unknown
      roles: '@AllRoles'
      layout: '{"topForm":"FileFilter","filterUI":"no"}'
      operations:
      - FileFilter
      code: |-
          SELECT
            f.species    AS "Species",
            f.exp_design AS "Data type",
            f.data_type  AS "TYPE", 

            <if parameter="has_cell">
               f.cell_id AS "___cell_id",
               c.title AS "Cell type",
               '<link table="${INFO_SCHEMA}.cells" queryName="Details" using="___cell_id" columns="ID" />;<quick visible="true" />' AS ";Cell type",
            </if>
   
            <if parameter="has_exp">
               e.treatment AS "Treatment;<quick visible='true' />",
               f.exp_id AS "___exp_id",
               f.exp_id AS "Experiment",
               '<link table="${INFO_SCHEMA}.experiments" queryName="Details" using="___exp_id" columns="ID" />' AS ";Experiment",
               <@linkGEO "e.geo_gse" /> AS "GEO series;<quick visible='true' />",
               <@linkGEO "e.geo_gsm" /> AS "GEO sample;<quick visible='true' />",
            </if>
            
            f.peakcaller AS "Peak caller;<quick visible='true'/>",
            f.assembly AS "Assembly;<quick visible='false'/>",
            
            f.target,
            
            <if parameter="has_tf">
               CONCAT('<a href="https://www.uniprot.org/uniprot/', u.id, '" target="_blank">', u.id,'</a>') AS "Uniprot;<quick visible='true' />",
               u.gene_name AS "Gene;<quick visible='true' />",
               u.protein_names AS "Protein;<quick visible='true' />",
            </if>

            f.item_count "# elements",
            f.size AS "File size",
            f.format AS "Format",
            CONCAT('<a href="', f.path, '">', f.name, '</a>') AS "Download",
            IF( f.format = 'bigBed' OR f.format = 'bigWig',
                '<a href="http://genome.ucsc.edu/cgi-bin/hgTracks?db=' || f.assembly || '&hgct_customText=' || f.path || '" target="_blank">UCSC</a>',
                '') AS "Genome browser"
          
          FROM ${INFO_SCHEMA}.files_info f
          <if parameter="has_tf">   LEFT JOIN ${INFO_SCHEMA}.uniprot u ON u.id=f.target       </if>
          <if parameter="has_cell"> LEFT JOIN ${INFO_SCHEMA}.cells c ON c.id = f.cell_id      </if>
          <if parameter="has_exp">  LEFT JOIN ${INFO_SCHEMA}.experiments e ON e.id = f.exp_id </if>

          WHERE (1=1)

          <if parameter="species">
            AND f.species = '<parameter:species/>'
          </if>

          <if parameter="experiment">
             AND f.exp_design = <parameter:experiment/> 
          </if>

          <if parameter="data">
             AND f.data_type = <parameter:data/> 
          </if>

          <if parameter="peackcaller">
             AND f.peakcaller = <parameter:data/> 
          </if>

          <if parameter="cell">
             AND ( c.title LIKE '%<parameter:cell/>%')  
          </if>

          ${search_tf}
          ${search_geo}

  - Statistics:
      type: 1D_unknown
      roles: '@AllRoles'
      invisible: true
      layout: '{"topForm":"FileStatisticsFilter","filterUI":"no"}'
      operations:
      - FileStatisticsFilter
      code: |-
          SELECT
            f.species AS "Species",
            f.exp_design AS "Experiment type",
            dt.name AS "Data type",
            f.peakcaller AS "Peak caller", 
            f.num AS "#;<aggregate function='SUM' type='Number' format='###,###,###,##0.' cssClass='total' />",
            
            '<a href="#!table/gtrd_current.files_info/List' 
            || '/species=' || f.species 
            || '/experiment=' || f.exp_design
            || '/data=' || f.data_type
            || IF(f.peakcaller != null AND f.peakcaller != 'MACS2,GEM,PICS,SISSRS', '/peakcaller=' || peakcaller, '')
            || IF( (f.exp_design = 'ChIP-seq' OR f.exp_design = 'ChIP-exo') AND f.data_type = 'Peaks', '/has_tf=true', '')
            || '/has_experiment=true/has_cell=true'
            || '">list</a>' AS "Details"

          FROM ${INFO_SCHEMA}.files_info_stats f
          LEFT JOIN ${INFO_SCHEMA}.data_types dt ON dt.id = f.data_type
          WHERE (1=1)
          <if parameter="species">    AND f.species    = '<parameter:species/>'    </if>
          <if parameter="experiment"> AND f.exp_design = '<parameter:experiment/>' </if>
          <if parameter="data">       AND f.data_type  = '<parameter:data/>'       </if>
          ORDER BY f.species, f.exp_design, dt.order_

  operations:
  - FileFilter:
      type: Groovy
      roles: '@AllRoles'
      layout: '{"title":""}'
      file: operations.FileFilter.groovy
  - FileStatisticsFilter:
      type: Groovy
      roles: '@AllRoles'
      layout: '{"title":""}'
      file: operations.FileStatisticsFilter.groovy
        