cage_enhancers_:
  type: table
  displayName: Enhancers
  order: '71'
  primaryKey: id
 
  queries:

  - 'Homo sapiens':
      type: static
      roles: '@AllRoles'
      value: cage_enhancers_.redir?_qn_=List&genome=hg38&species=Homo sapiens
  - 'Mus musculus':
      type: static
      roles: '@AllRoles'
      value: cage_enhancers_.redir?_qn_=List&genome=mm10&species=Mus musculus
  - 'Rattus norvegicus':
      type: static
      roles: '@AllRoles'
      value: cage_enhancers_.redir?_qn_=List&genome=rn6&species=Rattus norvegicus
  - 'Gallus gallus':
      type: static
      roles: '@AllRoles'
      value: cage_enhancers_.redir?_qn_=List&genome=galGal5&species=Gallus gallus

  - 'List':
      type: 1D_unknown
      invisible: true
      roles: '@AllRoles'
      layout: '{"topForm":"EnhancerFilter","quickType":"select","filterUI":"no"}'
      operations:
      - EnhancerFilter
      code: |-
          SELECT
            '<a href="#!table/cage_enhancers_/Details/genome=' || '<parameter:genome/>' ||
            '/species=' || '<parameter:species/>'  ||
            '/id=' || id || '">' || id || '</a>' AS "ID",
            
            '<parameter:species/>' AS "Species;<quick visible='true' />", 
            e.chrom AS "Chromosome",
            e.`start` AS "Start",
            e.`end` AS "End",
            e.name AS "Name", 
            e.type AS "Source" 
          FROM ${INFO_SCHEMA}.cage_enhancers_<parameter:genome/> e 
          WHERE 1=1 
          <if parameter="chromosome"> AND e.chrom    = '<parameter:chromosome/>' </if>
          <if parameter="start">      AND e.`start` >= <parameter:start/>        </if>
          <if parameter="end">        AND e.`start` <= <parameter:end/>          </if>
          ORDER BY chrom, `start`, `end`      

  - 'Details':
      type: 1D_unknown
      invisible: true
      roles: '@AllRoles'
      layout: '{"tableBox":"enhancerDetails", "mode":"named", "hideTitle":"true"}'
      code: |-
          SELECT
            id AS "ID",
            'Enhancer: ' || id AS "PageTitle",
            
            '<parameter:species/>' AS "Species", 
            '<parameter:genome/>'  AS "Genome", 

            e.chrom AS "Chromosome",
            e.`start` AS "Start",
            e.`end` AS "End",
            e.name AS "Name", 
            e.type AS "Source" 

          FROM ${INFO_SCHEMA}.cage_enhancers_<parameter:genome/> e 
          WHERE id=<parameter:id/>
 
  - 'Regulated genes':
      type: 1D_unknown
      invisible: true
      roles: '@AllRoles'
      layout: '{"hideTitle":"true", "filterUI":"no"}'
      code: |-
          SELECT
            e.ensembl_gene_id AS "Gene",
            e.type AS "Type",

            CASE 
               WHEN e.distance = -1 THEN '-'
               ELSE e.distance
            END AS "Distance",
            
            e.corr AS "Correlation;<format mask='#,###0.000' />",
            e.padj AS "P adjusted;<format mask='#,###0.000' />"

          FROM ${INFO_SCHEMA}.cage_enhancers2genes_<parameter:genome/> e
          WHERE e.enhancer_id=<parameter:id/>
          
  operations:
  - EnhancerFilter:
      type: Groovy
      roles: '@AllRoles'
      layout: '{"title":""}'
      file: operations.EnhancerFilter.groovy
          