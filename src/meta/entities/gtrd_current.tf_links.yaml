gtrd_current.tf_links:
  type: table
  displayName: TF & cofactors
  order: '20'
  primaryKey: id
  scheme:
    columns:
    - id:
        type: INT
        primaryKey: true
    - gene:
        type: VARCHAR(20)
        canBeNull: true
    - type:
        type: VARCHAR(10)
        canBeNull: true
    - animal_db:
        type: VARCHAR(40)
        canBeNull: true
    - cis_bp:
        type: VARCHAR(40)
        canBeNull: true
    - tf_class_id:
        type: VARCHAR(40)
        canBeNull: true
    - gtrd_uniprot_id:
        type: VARCHAR(30)
        canBeNull: true
    - function:
        type: TEXT
        canBeNull: true
    - specie:
        type: VARCHAR(50)
        canBeNull: true
    - chip_seq:    
        type: INT
        canBeNull: true
    - chip_exo:    
        type: INT
        canBeNull: true

  queries:

  - Brief:
      type: 1D_unknown
      roles: '@AllRoles'
      layout: '{"topForm":"TFFilter","filterUI":"no"}'
      operations:
      - TFFilter
      code: |-
          SELECT
            tf.id AS ID,
            tf.specie AS "Species",
            tf.gene AS "Gene",
            tf.type AS "Type",
            
            <@linkAnimalDB "tf.animal_db" "tf.type" /> AS "Animal TFDB",
            <@linkCisBP "tf.cis_bp"            />      AS "CIS-BP",
            <@linkTFClass "tf.tf_class_id"     />      AS "TF class",
            
            IF(tf.gtrd_uniprot_id != '',
            '<a href="#!table/gtrd_current.tf_links/Details/uniprot=' || tf.gtrd_uniprot_id || '">' || tf.gtrd_uniprot_id || '</a>', 
            '') AS "GTRD",
            
            tf.chip_seq AS "ChIP-seq", 
            tf.chip_exo AS "ChIP-exo", 
            
            tf.function AS "Function"                         
          FROM
            ${INFO_SCHEMA}.tf_links tf
          WHERE (1=1)

          <if parameter="species">
            AND specie like '<parameter:species/>%'
          </if>

          <if parameter="type" value="TF">           AND (1=1) </if>
          <if parameter="type" value="Cofactor">     AND (1=1) </if>
          <if parameter="type" value="Unclassified"> AND (1=1) </if>
          
          <if parameter="gene">
            AND gene like '<parameter:gene/>%'
          </if>

          <if parameter="ref"> AND (
            tf.animal_db       = '<parameter:ref/>' OR
            tf.cis_bp          = '<parameter:ref/>' OR
            tf.tf_class_id     = '<parameter:ref/>' OR
            tf.gtrd_uniprot_id = '<parameter:ref/>' 
            )
          </if>

          <if parameter="classification" value="AnimalTFDB"> AND tf.animal_db != '' AND tf.animal_db != '-'       </if>
          <if parameter="classification" value="Cis-BP">     AND tf.cis_bp != '' AND tf.cis_bp != 'unmatched'     </if>
          <if parameter="classification" value="TFClass">    AND tf.tf_class_id != ''  </if>
          <if parameter="classification" value="GTRD">       AND tf.gtrd_uniprot_id != ''  </if>

          <if parameter="classification" value="GTRD+AnimalTFDB"> AND tf.gtrd_uniprot_id != '' AND tf.animal_db != '' AND tf.animal_db != '-'       </if>
          <if parameter="classification" value="GTRD+Cis-BP">     AND tf.gtrd_uniprot_id != '' AND tf.cis_bp != '' AND tf.cis_bp != 'unmatched'     </if>
          <if parameter="classification" value="GTRD+TFClass">    AND tf.gtrd_uniprot_id != '' AND tf.tf_class_id != ''  </if>

          <if parameter="classification" value="GTRDmAnimalTFDB"> AND tf.gtrd_uniprot_id = '' AND tf.animal_db != '' AND tf.animal_db != '-'       </if>
          <if parameter="classification" value="GTRDmCis-BP">     AND tf.gtrd_uniprot_id = '' AND tf.cis_bp != '' AND tf.cis_bp != 'unmatched'     </if>
          <if parameter="classification" value="GTRDmTFClass">    AND tf.gtrd_uniprot_id = '' AND tf.tf_class_id != ''  </if>

          <if parameter="classification" value="GTRDuAnimalTFDB"> AND tf.gtrd_uniprot_id != '' AND (tf.animal_db = '' OR tf.animal_db = '-')       </if>
          <if parameter="classification" value="GTRDuCis-BP">     AND tf.gtrd_uniprot_id != '' AND (tf.cis_bp = '' OR tf.cis_bp = 'unmatched')     </if>
          <if parameter="classification" value="GTRDuTFClass">    AND tf.gtrd_uniprot_id != '' AND tf.tf_class_id = ''  </if>

          ORDER BY tf.specie, tf.type, tf.gene

  - Details:
      type: 1D_unknown
      layout: '{"tableBox":"TFTableBox", "mode":"named", "hideTitle":"true"}'
      invisible: true
      roles: '@AllRoles'
      code: |-
          SELECT
            tf.type || ' - ' || tf.gene || '(' || tf.gtrd_uniprot_id || ')' AS "PageTitle",

            tf.id AS "id",
            tf.specie AS "species",
            tf.gene AS "gene",
            tf.type AS "type",
            tf.gtrd_uniprot_id AS "uniprot",
            
            <@linkAnimalDB "tf.animal_db" "tf.type" /> AS "linkAnimalTFDB",
            <@linkCisBP "tf.cis_bp"            />      AS "linkCisBP",
            <@linkTFClass "tf.tf_class_id"     />      AS "linkTFClass",
            <@linkUniprot "tf.gtrd_uniprot_id "/>      AS "linkUniprot",
            
            u.gene_names    AS "geneNames",
            u.protein_names AS "proteinNames",
            
            tf.chip_seq AS "ChIP-seq", 
            tf.chip_exo AS "ChIP-exo", 
            
            tf.function AS "Function"                         
          FROM
            ${INFO_SCHEMA}.tf_links tf
            LEFT JOIN ${INFO_SCHEMA}.uniprot u ON u.id = tf.gtrd_uniprot_id

          WHERE (1=1)
          <if parameter="uniprot"> AND gtrd_uniprot_id = '<parameter:uniprot/>' </if>

  operations:
  - TFFilter:
      type: Groovy
      layout: '{"title":""}'
      roles: '@AllRoles'
      file: operations.TFFilter.groovy
        